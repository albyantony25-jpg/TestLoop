<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TestLoop - Autonomous Test Generation Agent</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #12151A;
      --card-bg: #1A1E26;
      --card-border: #2A303C;
      --text-main: #E8E6E1;
      --text-muted: #6E7681;
      --color-pass: #3DDC84;
      --color-pass-bg: rgba(61, 220, 132, 0.12);
      --color-fail: #FF5C5C;
      --color-fail-bg: rgba(255, 92, 92, 0.12);
      --color-retry: #F5A623;
      --color-retry-bg: rgba(245, 166, 35, 0.12);
      --code-bg: #0D1015;
      --accent: #387ADF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      line-height: 1.5;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1280px;
      margin: 0 auto 24px auto;
      width: 100%;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .brand .tagline {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--color-pass);
    }

    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      flex: 1;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    textarea {
      width: 100%;
      height: 380px;
      background: var(--code-bg);
      color: var(--text-main);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus-visible {
      border-color: var(--color-pass);
      box-shadow: 0 0 0 2px rgba(61, 220, 132, 0.2);
    }

    .btn-submit {
      background: var(--color-pass);
      color: #0B0E12;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(61, 220, 132, 0.4);
    }

    .btn-submit:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      max-height: calc(100vh - 160px);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--text-muted);
      text-align: center;
      gap: 12px;
      border: 1px dashed var(--card-border);
      border-radius: 8px;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--card-border);
      border-top-color: var(--color-pass);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .card {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .iteration-num {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-main);
    }

    .pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .pill.pass {
      color: var(--color-pass);
      background: var(--color-pass-bg);
      border: 1px solid rgba(61, 220, 132, 0.3);
    }

    .pill.fail {
      color: var(--color-fail);
      background: var(--color-fail-bg);
      border: 1px solid rgba(255, 92, 92, 0.3);
    }

    .pill.retry {
      color: var(--color-retry);
      background: var(--color-retry-bg);
      border: 1px solid rgba(245, 166, 35, 0.3);
    }

    pre {
      background: #06080B;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      line-height: 1.5;
      color: #D4D4D4;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .eval-box {
      font-size: 13px;
      padding: 8px 12px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      display: flex;
      gap: 6px;
    }

    .eval-box strong {
      color: var(--text-muted);
    }

    details {
      font-size: 13px;
    }

    summary {
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      user-select: none;
      padding: 4px 0;
    }

    summary:hover {
      color: var(--text-main);
    }

    summary:focus-visible {
      outline: none;
      color: var(--color-pass);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>TestLoop</h1>
      <span class="tagline">Autonomous Test-Generation Agent</span>
    </div>
    <div class="status-badge">
      <div class="status-dot"></div>
      API Connected
    </div>
  </header>

  <main>
    <!-- Left Column: Source Code Input -->
    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Python Source Code</h2>
      </div>
      <textarea id="sourceCode" spellcheck="false" placeholder="Enter Python function or class source code here...">def add(a, b):
    return a + b

def divide(a, b):
    if b == 0:
        raise ValueError("Cannot divide by zero")
    return a / b
</textarea>
      <button id="generateBtn" class="btn-submit" onclick="generateTests()">
        <span>Generate Tests</span>
      </button>
    </section>

    <!-- Right Column: Agent Execution History -->
    <section class="panel">
      <div class="panel-header">
        <h2 class="panel-title">Agent Execution History</h2>
        <span id="summaryBadge"></span>
      </div>

      <div id="resultsContainer" class="results-container">
        <div class="empty-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6"></polyline>
            <polyline points="8 6 2 12 8 18"></polyline>
          </svg>
          <p>Click "Generate Tests" to start the self-correcting agent loop.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    async function generateTests() {
      const sourceCode = document.getElementById("sourceCode").value.trim();
      const resultsContainer = document.getElementById("resultsContainer");
      const generateBtn = document.getElementById("generateBtn");
      const summaryBadge = document.getElementById("summaryBadge");

      if (!sourceCode) {
        alert("Please enter Python source code first.");
        return;
      }

      // UI Loading State
      generateBtn.disabled = true;
      generateBtn.innerHTML = `<span>Generating & Running...</span>`;
      summaryBadge.innerHTML = "";
      resultsContainer.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Executing agent loop (LLM generation, pytest execution, and self-correction)...</p>
        </div>
      `;

      try {
        const response = await fetch("/generate-tests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source_code: sourceCode })
        });

        if (!response.ok) {
          throw new Error(`Server returned HTTP ${response.status}`);
        }

        const data = await response.json();
        renderResults(data);
      } catch (err) {
        resultsContainer.innerHTML = `
          <div class="empty-state" style="color: var(--color-fail); border-color: rgba(255,92,92,0.3);">
            <p><strong>Error calling API:</strong> ${err.message}</p>
          </div>
        `;
      } finally {
        generateBtn.disabled = false;
        generateBtn.innerHTML = `<span>Generate Tests</span>`;
      }
    }

    function renderResults(data) {
      const resultsContainer = document.getElementById("resultsContainer");
      const summaryBadge = document.getElementById("summaryBadge");

      const history = data.history || [];
      if (history.length === 0) {
        resultsContainer.innerHTML = `<div class="empty-state"><p>No iterations recorded.</p></div>`;
        return;
      }

      // Render summary pill in panel header
      if (data.success) {
        summaryBadge.innerHTML = `<span class="pill pass">Passed in ${data.iterations} iteration(s)</span>`;
      } else {
        summaryBadge.innerHTML = `<span class="pill fail">Failed after ${data.iterations} iteration(s)</span>`;
      }

      let html = "";
      history.forEach((step, index) => {
        const isGood = step.evaluation ? step.evaluation.is_good : false;
        const isLast = index === history.length - 1;

        let pillClass = "fail";
        let pillText = "FAILED";

        if (isGood) {
          pillClass = "pass";
          pillText = "PASSED";
        } else if (!isLast) {
          pillClass = "retry";
          pillText = "RETRYING";
        }

        const testCode = escapeHtml(step.llm_output ? step.llm_output.tests : "");
        const evalReason = escapeHtml(step.evaluation ? step.evaluation.reason : "");
        const stdoutLog = escapeHtml(step.run_result ? step.run_result.stdout : "");

        html += `
          <div class="card">
            <div class="card-header">
              <span class="iteration-num">Iteration ${step.iteration}</span>
              <span class="pill ${pillClass}">${pillText}</span>
            </div>

            <pre><code>${testCode}</code></pre>

            <div class="eval-box">
              <strong>Evaluation:</strong> ${evalReason}
            </div>

            ${stdoutLog ? `
              <details>
                <summary>Pytest stdout log</summary>
                <pre style="margin-top: 8px;"><code>${stdoutLog}</code></pre>
              </details>
            ` : ""}
          </div>
        `;
      });

      resultsContainer.innerHTML = html;
    }

    function escapeHtml(text) {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
